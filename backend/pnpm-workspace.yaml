packages:
  - "shared/*"
  - "services/*"
  - "e2e"
overrides:
  # CVE transitiva via @nestjs/platform-express (DoS em multipart <2.3.0):
  # força a versão corrigida em toda a árvore.
  multer: ^2.3.0
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  argon2: true
  "@scarf/scarf": true
  unrs-resolver: true
  cpu-features: true
  protobufjs: true
  ssh2: true
