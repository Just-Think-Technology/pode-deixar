services:

  # -- Auth Service --
  auth:
    build:
      context: ./backend
      target: auth-build
    env_file: ./backend/.env.staging
    environment:
      FRONTEND_URL: http://localhost:8080
      SMTP_HOST: mailpit
      TZ: America/Sao_Paulo
    ports:
      - "3001:3001"
    depends_on:
      - mailpit

  # -- Users Service --
  users:
    build:
      context: ./backend
      target: users-build
    env_file: ./backend/.env.staging
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "3002:3002"
    depends_on:
      auth:
        condition: service_started

  # -- Service Orders Service --
  service-orders:
    build:
      context: ./backend
      target: service-orders-build
    env_file: ./backend/.env.staging
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "3003:3003"
    depends_on:
      auth:
        condition: service_started

  # -- Payments Service --
  payments:
    build:
      context: ./backend
      target: payments-build
    env_file: ./backend/.env.staging
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "3004:3004"
    depends_on:
      auth:
        condition: service_started

  # -- Frontend (Next.js) --
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - auth
      - users

  # -- MinIO --
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file: ./backend/.env.staging
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -- MinIO Client (Bucket Setup) --
  minio-setup:
    image: minio/mc:latest
    env_file: ./backend/.env.staging
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:$${MINIO_PORT:-9000} $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb local/$${MINIO_SERVICE_IMAGES_BUCKET:-service-images} --ignore-existing &&
      mc anonymous set public local/$${MINIO_SERVICE_IMAGES_BUCKET:-service-images} &&
      mc mb local/$${MINIO_AVATARS_BUCKET:-avatars} --ignore-existing &&
      mc anonymous set public local/$${MINIO_AVATARS_BUCKET:-avatars} &&
      mc mb local/$${MINIO_ORDER_PHOTOS_BUCKET:-order-photos} --ignore-existing &&
      mc anonymous set public local/$${MINIO_ORDER_PHOTOS_BUCKET:-order-photos} &&
      echo 'Buckets created successfully'
      "

  # -- Mailpit (SMTP Testing) --
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # -- Proxy Reverso (Caddy) --
  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile
    depends_on:
      - auth
      - users
      - service-orders
      - payments
      - frontend

volumes:
  minio_data:
