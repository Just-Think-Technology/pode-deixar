# ============================================================
# Pode Deixar - Stack local (desenvolvimento contra o banco de staging)
# ============================================================
# Tudo roda local (serviços, frontend, MinIO, Redis, Mailpit, Caddy),
# EXCETO o banco: DATABASE_URL aponta para o Neon de staging, vindo do
# .env.staging. Não há Postgres local neste arquivo.
# O serviço `auth` aplica migrations (prisma migrate deploy) no startup
# via entrypoint da imagem — ou seja, subir a stack pode aplicar DDL no
# banco de staging. Nada destrutivo à mão contra staging (ver AGENTS.md).
#
#   docker compose --env-file .env.staging up -d --build
#
# Com hot-reload: acrescente -f docker-compose.dev.yml
# ============================================================

services:

  # -- Auth Service --
  auth:
    build:
      context: ./backend
      target: auth-build
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: ./.env.staging
    environment:
      FRONTEND_URL: http://localhost:8080
      SMTP_HOST: mailpit
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      mailpit:
        condition: service_started

  # -- Users Service --
  users:
    build:
      context: ./backend
      target: users-build
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: ./.env.staging
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      auth:
        condition: service_started

  # -- Service Orders Service --
  service-orders:
    build:
      context: ./backend
      target: service-orders-build
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: ./.env.staging
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      auth:
        condition: service_started

  # -- Payments Service --
  payments:
    build:
      context: ./backend
      target: payments-build
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: ./.env.staging
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:3004:3004"
    depends_on:
      auth:
        condition: service_started

  # -- Reviews Service --
  reviews:
    build:
      context: ./backend
      target: reviews-build
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: ./.env.staging
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:3005:3005"
    depends_on:
      auth:
        condition: service_started

  # -- Frontend (Next.js) --
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8080/api
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - auth
      - users

  # -- MinIO --
  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    env_file: ./.env.staging
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -- MinIO Client (Bucket Setup) --
  minio-setup:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    env_file: ./.env.staging
    depends_on:
      minio:
        condition: service_healthy
    # dev-only: credenciais padrão minioadmin por conveniência local; nunca usar em staging/produção
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:$${MINIO_PORT:-9000} $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb local/$${MINIO_SERVICE_IMAGES_BUCKET:-service-images} --ignore-existing &&
      mc anonymous set public local/$${MINIO_SERVICE_IMAGES_BUCKET:-service-images} &&
      mc mb local/$${MINIO_AVATARS_BUCKET:-avatars} --ignore-existing &&
      mc anonymous set public local/$${MINIO_AVATARS_BUCKET:-avatars} &&
      mc mb local/$${MINIO_ORDER_PHOTOS_BUCKET:-order-photos} --ignore-existing &&
      echo 'Buckets created successfully'
      "

  # -- Mailpit (SMTP Testing) --
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # -- Redis (Rate Limiting Distribuído) --
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -- Proxy Reverso (Caddy) --
  caddy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile
    depends_on:
      - auth
      - users
      - service-orders
      - payments
      - reviews
      - frontend

volumes:
  minio_data:
  redis_data:
