# ============================================================
# Pode Deixar - Stack local (PostgreSQL próprio)
# ============================================================
# Tudo roda local: serviços, frontend, Postgres, MinIO, Redis, Mailpit,
# Caddy (+ backup diário do banco local). O .env.dev (versionado) fornece
# as configs de dev; DATABASE_URL é montada para o Postgres local mesmo
# que outro --env-file seja passado. Staging/prod usam os arquivos
# docker-compose.staging.yml / docker-compose.production.yml (Neon).
#
#   docker compose up -d --build
#
# Para hot-reload use o docker-compose.dev.yml (comando único):
#   docker compose -f docker-compose.dev.yml up -d --build
# ============================================================

services:

  # -- PostgreSQL (local) --
  postgres:
    image: postgres:16-alpine
    env_file: ./.env.dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pode_deixar}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pode_deixar}']
      interval: 10s
      timeout: 5s
      retries: 5

  # -- Auth Service --
  auth:
    build:
      context: ./backend
      target: auth-build
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: ./.env.dev
    environment:
      FRONTEND_URL: http://localhost:8080
      SMTP_HOST: mailpit
      TZ: America/Sao_Paulo
      # Banco local (montada para o Postgres do compose, mesmo que
      # outro --env-file seja passado)
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  # -- Users Service --
  users:
    build:
      context: ./backend
      target: users-build
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: ./.env.dev
    environment:
      TZ: America/Sao_Paulo
      # Banco local (montada para o Postgres do compose, mesmo que
      # outro --env-file seja passado)
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started

  # -- Service Orders Service --
  service-orders:
    build:
      context: ./backend
      target: service-orders-build
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: ./.env.dev
    environment:
      TZ: America/Sao_Paulo
      # Banco local (montada para o Postgres do compose, mesmo que
      # outro --env-file seja passado)
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started

  # -- Payments Service --
  payments:
    build:
      context: ./backend
      target: payments-build
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: ./.env.dev
    environment:
      TZ: America/Sao_Paulo
      # Banco local (montada para o Postgres do compose, mesmo que
      # outro --env-file seja passado)
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
    ports:
      - "127.0.0.1:3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started

  # -- Reviews Service --
  reviews:
    build:
      context: ./backend
      target: reviews-build
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: ./.env.dev
    environment:
      TZ: America/Sao_Paulo
      # Banco local (montada para o Postgres do compose, mesmo que
      # outro --env-file seja passado)
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
    ports:
      - "127.0.0.1:3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started

  # -- Frontend (Next.js) --
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8080/api
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - auth
      - users

  # -- MinIO --
  minio:
    image: quay.io/minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    env_file: ./.env.dev
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -- MinIO Client (Bucket Setup) --
  minio-setup:
    image: quay.io/minio/aistor/mc:latest@sha256:b8a369454c7cffe3aab1cc6e6b3e7e1eb958415ea275315245d994d830299dbb
    env_file: ./.env.dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:$${MINIO_PORT:-9000} $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb local/$${MINIO_SERVICE_IMAGES_BUCKET:-service-images} --ignore-existing &&
      mc anonymous set public local/$${MINIO_SERVICE_IMAGES_BUCKET:-service-images} &&
      mc mb local/$${MINIO_AVATARS_BUCKET:-avatars} --ignore-existing &&
      mc anonymous set public local/$${MINIO_AVATARS_BUCKET:-avatars} &&
      mc mb local/$${MINIO_ORDER_PHOTOS_BUCKET:-order-photos} --ignore-existing &&
      echo 'Buckets created successfully'
      "

  # -- Mailpit (SMTP Testing) --
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # -- Redis (Rate Limiting Distribuído) --
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -- PostgreSQL Backup (pg_dump cron, banco local) --
  postgres-backup:
    image: postgres:16-alpine
    env_file: ./.env.dev
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-pode_deixar}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      BACKUP_SCHEDULE: "0 3 * * *"  # Diário às 03:00 UTC
      BACKUP_RETENTION_DAYS: "7"
      BACKUP_DIR: /backups
    volumes:
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      # crond/crontab já vêm no BusyBox da imagem (não instalar nada);
      # o pipe para `crontab -` grava no spool que o crond realmente lê
      echo \"$${BACKUP_SCHEDULE} /usr/local/bin/backup.sh >> /var/log/cron.log 2>&1\" | crontab - &&
      cat > /usr/local/bin/backup.sh << 'EOF'
      #!/bin/sh
      set -e
      TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
      FILE=\"$${BACKUP_DIR}/pode_deixar_$${TIMESTAMP}.sql.gz\"
      echo \"[$$(date)] Iniciando backup para $${FILE}\"
      pg_dump -h $${POSTGRES_HOST} -U $${POSTGRES_USER} -d $${POSTGRES_DB} | gzip > $${FILE}
      echo \"[$$(date)] Backup concluído: $${FILE}\"
      # Limpeza de backups antigos
      find $${BACKUP_DIR} -name 'pode_deixar_*.sql.gz' -mtime +$${BACKUP_RETENTION_DAYS} -delete
      echo \"[$$(date)] Limpeza de backups antigos (> $${BACKUP_RETENTION_DAYS} dias) concluída\"
      EOF
      chmod +x /usr/local/bin/backup.sh &&
      # Executa backup inicial imediatamente
      /usr/local/bin/backup.sh &&
      # Inicia cron em foreground
      crond -f -l 2
      "

  # -- Proxy Reverso (Caddy) --
  caddy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile
    depends_on:
      - auth
      - users
      - service-orders
      - payments
      - reviews
      - frontend

volumes:
  minio_data:
  postgres_data:
  backup_data:
  redis_data:
