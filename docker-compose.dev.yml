# purpose: Pode Deixal local stack with hot-reload (single command).
# Includes docker-compose.yml and applies dev overrides. Postgres is local
# (host port 15432, since host system Postgres uses 5432); storage is local
# MinIO (fixed dev credentials overridden below).
#
#   docker compose -f docker-compose.dev.yml up -d --build
#
# Inclui o docker-compose.yml e aplica os overrides de dev. Banco é o
# Postgres local (porta do host 15432, pois o Postgres do sistema usa a
# 5432); storage é o MinIO local (credencial fixa de dev, sobreposta por
# serviço abaixo).

include:
  - path: docker-compose.yml

name: pode-deixar-dev

services:

  # -- Postgres local: host port different from system --
  postgres:
    ports: !override
      - "15432:5432"

  # -- MinIO local (dev fixed credentials) --
  minio:
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  # -- Frontend (dev, hot-reload) --
  # Production image in base compose does not mount code; without this override,
  # changes on host do not appear until rebuild.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8080/api
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8080/api
      # SSR inside Docker network (localhost:8080 fails in container)
      BACKEND_INTERNAL_URL: http://caddy:8080/api
      WATCHPACK_POLLING: "true"
      CI: "true"
    command: pnpm dev --hostname 0.0.0.0 --port 3000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  # -- Auth Service (dev, hot-reload) --
  auth:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file: ./.env.dev
    environment:
      FRONTEND_URL: http://localhost:8080
      ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000"
      SMTP_HOST: mailpit
      TZ: America/Sao_Paulo
      # Storage local: acompanha o MinIO de dev acima (como o banco,
      # que é o Postgres local do compose base)
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports: !override
      - "3001:3001"
    command: >
      sh -c "pnpm exec prisma migrate deploy --schema=prisma/schema.prisma &&
             pnpm run --filter @pode-deixar/auth start:dev"
    volumes:
      - ./backend/services/auth/src:/app/services/auth/src
      - ./backend/services/auth/tsconfig.json:/app/services/auth/tsconfig.json
      - ./backend/services/auth/tsconfig.build.json:/app/services/auth/tsconfig.build.json
      - ./backend/services/auth/nest-cli.json:/app/services/auth/nest-cli.json
      - ./backend/shared/logger:/app/shared/logger
      - ./backend/shared/email:/app/shared/email
      - ./backend/shared/security:/app/shared/security
      - ./backend/shared/validation:/app/shared/validation
      - ./backend/prisma:/app/prisma
    depends_on:
      mailpit:
        condition: service_started

  # -- Users Service (dev, hot-reload) --
  users:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file: ./.env.dev
    environment:
      TZ: America/Sao_Paulo
      # Storage local: acompanha o MinIO de dev acima (como o banco,
      # que é o Postgres local do compose base)
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports: !override
      - "3002:3002"
    command: pnpm run --filter @pode-deixar/users start:dev
    volumes:
      - ./backend/services/users/src:/app/services/users/src
      - ./backend/services/users/tsconfig.json:/app/services/users/tsconfig.json
      - ./backend/services/users/tsconfig.build.json:/app/services/users/tsconfig.build.json
      - ./backend/services/users/nest-cli.json:/app/services/users/nest-cli.json
      - ./backend/shared/logger:/app/shared/logger
      - ./backend/shared/security:/app/shared/security
      - ./backend/shared/validation:/app/shared/validation
      - ./backend/prisma:/app/prisma

  # -- Service Orders Service (dev, hot-reload) --
  service-orders:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file: ./.env.dev
    environment:
      TZ: America/Sao_Paulo
      # Storage local: acompanha o MinIO de dev acima (como o banco,
      # que é o Postgres local do compose base)
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports: !override
      - "3003:3003"
    # tsbuildinfo incremental + deleteOutDir can delete dist and not re-emit
    command: >
      sh -c "rm -f /app/services/service-orders/tsconfig.build.tsbuildinfo &&
             pnpm run --filter @pode-deixar/service-orders start:dev"
    volumes:
      - ./backend/services/service-orders/src:/app/services/service-orders/src
      - ./backend/services/service-orders/tsconfig.json:/app/services/service-orders/tsconfig.json
      - ./backend/services/service-orders/tsconfig.build.json:/app/services/service-orders/tsconfig.build.json
      - ./backend/services/service-orders/nest-cli.json:/app/services/service-orders/nest-cli.json
      - ./backend/shared/logger:/app/shared/logger
      - ./backend/shared/security:/app/shared/security
      - ./backend/shared/validation:/app/shared/validation
      - ./backend/prisma:/app/prisma

  # -- Payments Service (dev, hot-reload) --
  payments:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file: ./.env.dev
    environment:
      TZ: America/Sao_Paulo
      # Storage local: acompanha o MinIO de dev acima (como o banco,
      # que é o Postgres local do compose base)
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports: !override
      - "3004:3004"
    command: >
      sh -c "pnpm exec prisma generate --schema=prisma/schema.prisma &&
             pnpm exec prisma migrate deploy --schema=prisma/schema.prisma &&
             pnpm run --filter @pode-deixar/payments start:dev"
    volumes:
      - ./backend/services/payments/src:/app/services/payments/src
      - ./backend/services/payments/tsconfig.json:/app/services/payments/tsconfig.json
      - ./backend/services/payments/tsconfig.build.json:/app/services/payments/tsconfig.build.json
      - ./backend/services/payments/nest-cli.json:/app/services/payments/nest-cli.json
      - ./backend/shared/logger:/app/shared/logger
      - ./backend/shared/security:/app/shared/security
      - ./backend/shared/validation:/app/shared/validation
      - ./backend/prisma:/app/prisma

  # -- Reviews Service (dev, hot-reload) --
  reviews:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file: ./.env.dev
    environment:
      TZ: America/Sao_Paulo
      # Storage local: acompanha o MinIO de dev acima (como o banco,
      # que é o Postgres local do compose base)
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports: !override
      - "3005:3005"
    command: pnpm run --filter @pode-deixar/reviews start:dev
    volumes:
      - ./backend/services/reviews/src:/app/services/reviews/src
      - ./backend/services/reviews/tsconfig.json:/app/services/reviews/tsconfig.json
      - ./backend/services/reviews/tsconfig.build.json:/app/services/reviews/tsconfig.build.json
      - ./backend/services/reviews/nest-cli.json:/app/services/reviews/nest-cli.json
      - ./backend/shared/logger:/app/shared/logger
      - ./backend/shared/security:/app/shared/security
      - ./backend/shared/validation:/app/shared/validation
      - ./backend/prisma:/app/prisma

volumes:
  frontend_node_modules: