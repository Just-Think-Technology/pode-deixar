# ============================================================
# Pode Deixar - Deploy de PRODUÇÃO
# ============================================================
#   docker compose -f docker-compose.production.yml up -d --build
#
# Production-only:
# - Env: .env.production
# - Banco: Neon via DATABASE_URL
# - Frontend: Vercel
# - SMTP: serviço externo
# - Sem Postgres local
# - Sem Mailpit
# - Sem volumes de source code
# - Sem portas públicas nos serviços internos
# - Caddy: 80/443
# - Backup: pg_dump periódico do Neon
# ============================================================

name: pode-deixar-production

services:

  # -- Auth Service --
  auth:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      target: auth-build
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-https://app.pode-deixar.com}
      TZ: America/Sao_Paulo
    depends_on:
      minio:
        condition: service_healthy

  # -- Users Service --
  users:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      target: users-build
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
    depends_on:
      minio:
        condition: service_healthy

  # -- Service Orders Service --
  service-orders:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      target: service-orders-build
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
    depends_on:
      minio:
        condition: service_healthy

  # -- Payments Service --
  payments:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      target: payments-build
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo

  # -- Reviews Service --
  reviews:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      target: reviews-build
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo

  # -- MinIO --
  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    env_file:
      - ./.env.production
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -- MinIO Client --
  minio-setup:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    env_file:
      - ./.env.production
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:$${MINIO_PORT:-9000} $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb local/$${MINIO_SERVICE_IMAGES_BUCKET:-service-images} --ignore-existing &&
      mc anonymous set public local/$${MINIO_SERVICE_IMAGES_BUCKET:-service-images} &&
      mc mb local/$${MINIO_AVATARS_BUCKET:-avatars} --ignore-existing &&
      mc anonymous set public local/$${MINIO_AVATARS_BUCKET:-avatars} &&
      mc mb local/$${MINIO_ORDER_PHOTOS_BUCKET:-order-photos} --ignore-existing &&
      echo 'Buckets created successfully'
      "

  # -- Redis --
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -- Database Backup --
  db-backup:
    image: postgres:16-alpine
    env_file:
      - ./.env.production
    environment:
      BACKUP_SCHEDULE: "0 3 * * *"
      BACKUP_RETENTION_DAYS: "7"
      BACKUP_DIR: /backups
    volumes:
      - backup_data:/backups
    entrypoint: >
      /bin/sh -c "
      echo \"$${BACKUP_SCHEDULE} /usr/local/bin/backup.sh >> /var/log/cron.log 2>&1\" | crontab - &&
      cat > /usr/local/bin/backup.sh << 'EOF'
      #!/bin/sh
      set -e

      TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
      FILE=\"$${BACKUP_DIR}/pode_deixar_$${TIMESTAMP}.sql.gz\"

      echo \"[$$(date)] Iniciando backup para $${FILE}\"

      pg_dump \"$${DATABASE_URL}\" | gzip > \"$${FILE}\"

      echo \"[$$(date)] Backup concluído: $${FILE}\"

      find \"$${BACKUP_DIR}\" \
        -name 'pode_deixar_*.sql.gz' \
        -mtime +$${BACKUP_RETENTION_DAYS} \
        -delete

      echo \"[$$(date)] Limpeza de backups antigos (> $${BACKUP_RETENTION_DAYS} dias) concluída\"
      EOF

      chmod +x /usr/local/bin/backup.sh &&
      /usr/local/bin/backup.sh &&
      crond -f -l 2
      "

  # -- Reverse Proxy --
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - auth
      - users
      - service-orders
      - payments
      - reviews

volumes:
  minio_data:
  backup_data:
  redis_data:
  caddy_data:
  caddy_config: