# purpose: Local stack with own PostgreSQL (services, frontend, Postgres, MinIO, Redis, Mailpit, Caddy, daily backup)
# Config from .env.dev; run: docker compose up -d --build (hot-reload: docker compose -f docker-compose.dev.yml up -d --build)
# Staging/production: docker-compose.staging.yml and docker-compose.production.yml

services:

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    env_file:
      - ../.env.dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pode_deixar}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pode_deixar}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Auth Service ---
  auth:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
      target: auth-build
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env.dev
    environment:
      FRONTEND_URL: http://localhost:8080
      SMTP_HOST: mailpit
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  # --- Users Service ---
  users:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
      target: users-build
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env.dev
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started

  # --- Service Orders Service ---
  service-orders:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
      target: service-orders-build
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env.dev
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started

  # --- Payments Service ---
  payments:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
      target: payments-build
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env.dev
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
    ports:
      - "127.0.0.1:3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started

  # --- Reviews Service ---
  reviews:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
      target: reviews-build
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env.dev
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started

  # --- Frontend ---
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8080/api
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - auth
      - users

  # --- MinIO ---
  minio:
    image: quay.io/minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    env_file:
      - ../.env.dev
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- MinIO Setup ---
  minio-setup:
    image: quay.io/minio/aistor/mc:latest@sha256:b8a369454c7cffe3aab1cc6e6b3e7e1eb958415ea275315245d994d830299dbb
    env_file:
      - ../.env.dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:$${MINIO_PORT:-9000} $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb local/$${MINIO_SERVICE_IMAGES_BUCKET:-service-images} --ignore-existing &&
      mc anonymous set public local/$${MINIO_SERVICE_IMAGES_BUCKET:-service-images} &&
      mc mb local/$${MINIO_AVATARS_BUCKET:-avatars} --ignore-existing &&
      mc anonymous set public local/$${MINIO_AVATARS_BUCKET:-avatars} &&
      mc mb local/$${MINIO_ORDER_PHOTOS_BUCKET:-order-photos} --ignore-existing &&
      echo 'Buckets created successfully'
      "

  # --- Mailpit ---
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # --- Redis ---
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Prometheus ---
  # Same internal-only posture as production (loopback UIs via SSH tunnel or
  # plain localhost in local dev). Grafana lives on host port 3100 here
  # because the dev frontend already owns 3000.
  prometheus:
    image: prom/prometheus:v3
    user: "0:0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: America/Sao_Paulo
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules.yml:/etc/prometheus/rules.yml:ro
      - /etc/pode-deixar/metrics_token:/etc/prometheus/metrics_token:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - auth
      - users
      - service-orders
      - payments
      - reviews

  # --- Grafana ---
  grafana:
    image: grafana/grafana:11
    user: "0:0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env.dev
    environment:
      TZ: America/Sao_Paulo
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      - prometheus

  # --- Loki ---
  loki:
    image: grafana/loki:3
    user: "0:0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

  # --- Promtail ---
  promtail:
    image: grafana/promtail:3
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./observability/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_positions:/positions
    depends_on:
      - loki

  # --- Node Exporter ---
  node-exporter:
    image: prom/node-exporter:v1
    pid: host
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave

  # --- PostgreSQL Backup ---
  postgres-backup:
    image: postgres:16-alpine
    env_file:
      - ../.env.dev
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-pode_deixar}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      BACKUP_SCHEDULE: "0 3 * * *"
      BACKUP_RETENTION_DAYS: "7"
      BACKUP_DIR: /backups
    volumes:
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo \"$${BACKUP_SCHEDULE} /usr/local/bin/backup.sh >> /var/log/cron.log 2>&1\" | crontab - &&
      cat > /usr/local/bin/backup.sh << 'EOF'
      #!/bin/sh
      set -e

      TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
      FILE=\"$${BACKUP_DIR}/pode_deixar_$${TIMESTAMP}.sql.gz\"

      echo \"[$$(date)] Iniciando backup para $${FILE}\"

      pg_dump -h $${POSTGRES_HOST} \
        -U $${POSTGRES_USER} \
        -d $${POSTGRES_DB} | gzip > \"$${FILE}\"

      echo \"[$$(date)] Backup concluído: $${FILE}\"

      find \"$${BACKUP_DIR}\" \
        -name 'pode_deixar_*.sql.gz' \
        -mtime +$${BACKUP_RETENTION_DAYS} \
        -delete

      echo \"[$$(date)] Limpeza de backups antigos (> $${BACKUP_RETENTION_DAYS} dias) concluída\"
      EOF

      chmod +x /usr/local/bin/backup.sh &&
      /usr/local/bin/backup.sh &&
      crond -f -l 2
      "

  # --- Reverse Proxy ---
  caddy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      API_VERSION: ${API_VERSION:-v1}
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
    depends_on:
      - auth
      - users
      - service-orders
      - payments
      - reviews
      - frontend

volumes:
  minio_data:
  postgres_data:
  backup_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions: