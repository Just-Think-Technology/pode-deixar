# purpose: Local stack with own PostgreSQL (services, frontend, Postgres, MinIO, Redis, Mailpit, Caddy, daily backup)
# Config from .env.dev; run: docker compose up -d --build (hot-reload: docker compose -f docker-compose.dev.yml up -d --build)
# Staging/production: docker-compose.staging.yml and docker-compose.production.yml

services:

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    env_file:
      - ../.env.dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pode_deixar}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/prisma/roles.sql:/docker-entrypoint-initdb.d/roles.sql:ro
      - ../backend/prisma/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pode_deixar}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Auth Service ---
  auth:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
      target: auth-build
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env.dev
    environment:
      FRONTEND_URL: http://localhost:8080
      SMTP_HOST: mailpit
      TZ: America/Sao_Paulo
      DATABASE_URL: ${DB_AUTH_URL:-postgresql://role_auth:${DB_ROLE_AUTH_PASSWORD:-dev_auth}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public}
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  # --- Users Service ---
  users:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
      target: users-build
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env.dev
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: ${DB_USERS_URL:-postgresql://role_users:${DB_ROLE_USERS_PASSWORD:-dev_users}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public}
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started

  # --- Service Orders Service ---
  service-orders:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
      target: service-orders-build
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env.dev
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: ${DB_SERVICE_ORDERS_URL:-postgresql://role_service_orders:${DB_ROLE_SERVICE_ORDERS_PASSWORD:-dev_service_orders}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public}
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started

  # --- Payments Service ---
  payments:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
      target: payments-build
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env.dev
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: ${DB_PAYMENTS_URL:-postgresql://role_payments:${DB_ROLE_PAYMENTS_PASSWORD:-dev_payments}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public}
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
    ports:
      - "127.0.0.1:3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started

  # --- Reviews Service ---
  reviews:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
      target: reviews-build
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env.dev
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: ${DB_REVIEWS_URL:-postgresql://role_reviews:${DB_ROLE_REVIEWS_PASSWORD:-dev_reviews}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public}
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pode_deixar}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started

  # --- Frontend ---
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8080/api
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - auth
      - users

  # --- Object storage (S3) ---
  # SeaweedFS S3 gateway. IAM comes from a config generated at startup out of
  # STORAGE_ACCESS_KEY/STORAGE_SECRET_KEY, because without it SeaweedFS accepts
  # ANY access key. Generated rather than committed so no secret lands in git.
  #
  # The generated identities mirror what `mc anonymous set public` used to do
  # on the MinIO setup: avatars and service images are world-readable, because
  # the browser fetches those URLs directly, while order photos stay private
  # and are only read through a presigned URL. SeaweedFS scopes an action to a
  # bucket with the `Action:bucket` syntax.
  storage:
    image: chrislusf/seaweedfs:3.97
    entrypoint:
      - /bin/sh
      - -c
    command:
      - >
        printf '{"identities":[{"name":"anonymous","actions":["Read:%s","Read:%s"]},{"name":"pode-deixar","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","Delete","List","Tagging"]}]}' "$${STORAGE_SERVICE_IMAGES_BUCKET:-service-images}" "$${STORAGE_AVATARS_BUCKET:-avatars}" "$${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY must be set}" "$${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY must be set}" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=$${STORAGE_PORT:-8333} -s3.config=/tmp/s3.json
    ports:
      - "127.0.0.1:8333:8333"
    env_file:
      - ../.env.dev
    volumes:
      - seaweedfs_data:/data
    # A imagem não tem curl (3.97 traz wget/nc); nc só checa que o S3 está
    # aceitando conexão, que é o que importa para o job de buckets.
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # --- Storage buckets setup ---
  # mc is only an S3 client here; it works against any S3-compatible endpoint.
  storage-setup:
    image: quay.io/minio/aistor/mc:latest@sha256:b8a369454c7cffe3aab1cc6e6b3e7e1eb958415ea275315245d994d830299dbb
    env_file:
      - ../.env.dev
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:$${STORAGE_PORT:-8333} $${STORAGE_ACCESS_KEY:?} $${STORAGE_SECRET_KEY:?} &&
      mc mb local/$${STORAGE_SERVICE_IMAGES_BUCKET:-service-images} --ignore-existing &&
      mc mb local/$${STORAGE_AVATARS_BUCKET:-avatars} --ignore-existing &&
      mc mb local/$${STORAGE_ORDER_PHOTOS_BUCKET:-order-photos} --ignore-existing &&
      echo 'Buckets created successfully'
      "

  # --- Mailpit ---
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # --- Redis ---
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- PostgreSQL Backup ---
  postgres-backup:
    image: postgres:16-alpine
    env_file:
      - ../.env.dev
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-pode_deixar}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      BACKUP_SCHEDULE: "0 3 * * *"
      BACKUP_RETENTION_DAYS: "7"
      BACKUP_DIR: /backups
    volumes:
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo \"$${BACKUP_SCHEDULE} /usr/local/bin/backup.sh >> /var/log/cron.log 2>&1\" | crontab - &&
      cat > /usr/local/bin/backup.sh << 'EOF'
      #!/bin/sh
      set -e

      TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
      FILE=\"$${BACKUP_DIR}/pode_deixar_$${TIMESTAMP}.sql.gz\"

      echo \"[$$(date)] Iniciando backup para $${FILE}\"

      pg_dump -h $${POSTGRES_HOST} \
        -U $${POSTGRES_USER} \
        -d $${POSTGRES_DB} | gzip > \"$${FILE}\"

      echo \"[$$(date)] Backup concluído: $${FILE}\"

      find \"$${BACKUP_DIR}\" \
        -name 'pode_deixar_*.sql.gz' -mtime +$${BACKUP_RETENTION_DAYS} \
        -delete

      echo \"[$$(date)] Limpeza de backups antigos (> $${BACKUP_RETENTION_DAYS} dias) concluída\"
      EOF

      chmod +x /usr/local/bin/backup.sh &&
      /usr/local/bin/backup.sh &&
      crond -f -l 2
      "

  # --- Reverse Proxy ---
  caddy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      API_VERSION: ${API_VERSION:-v1}
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
    depends_on:
      - auth
      - users
      - service-orders
      - payments
      - reviews
      - frontend

volumes:
  seaweedfs_data:
  postgres_data:
  backup_data:
  redis_data: