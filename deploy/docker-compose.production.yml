# purpose: Production deploy (Neon database, Vercel frontend, external SMTP)
# Run: docker compose -f docker-compose.production.yml up -d --build
# Env: .env.production; no local Postgres, Mailpit, source volumes, or public ports on internal services
# Caddy on 80/443; periodic pg_dump backup of Neon

name: pode-deixar-production

services:

  # --- Auth Service ---
  auth:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: auth-build
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-https://app.pode-deixar.com}
      TZ: America/Sao_Paulo
    depends_on:
      minio:
        condition: service_healthy

  # --- Users Service ---
  users:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: users-build
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
    depends_on:
      minio:
        condition: service_healthy

  # --- Service Orders Service ---
  service-orders:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: service-orders-build
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
    depends_on:
      minio:
        condition: service_healthy

  # --- Payments Service ---
  payments:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: payments-build
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo

  # --- Reviews Service ---
  reviews:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: reviews-build
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo

  # --- MinIO ---
  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    env_file:
      - ../.env.production
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- MinIO Client ---
  minio-setup:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    env_file:
      - ../.env.production
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:$${MINIO_PORT:-9000} $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb local/$${MINIO_SERVICE_IMAGES_BUCKET:-service-images} --ignore-existing &&
      mc anonymous set public local/$${MINIO_SERVICE_IMAGES_BUCKET:-service-images} &&
      mc mb local/$${MINIO_AVATARS_BUCKET:-avatars} --ignore-existing &&
      mc anonymous set public local/$${MINIO_AVATARS_BUCKET:-avatars} &&
      mc mb local/$${MINIO_ORDER_PHOTOS_BUCKET:-order-photos} --ignore-existing &&
      echo 'Buckets created successfully'
      "

  # --- Redis ---
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Prometheus ---
  # Internal-only metrics; Prometheus and Grafana UIs bind host loopback
  # (reached via SSH tunnel), with no Caddy route. Runs as root because the
  # official scratch image cannot chown named volumes; contained by cap_drop
  # ALL + no-new-privileges + loopback-only ports.
  prometheus:
    image: prom/prometheus:v3
    user: "0:0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: America/Sao_Paulo
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules.yml:/etc/prometheus/rules.yml:ro
      - /etc/pode-deixar/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - auth
      - users
      - service-orders
      - payments
      - reviews

  # --- Grafana ---
  # Admin password comes from GF_SECURITY_ADMIN_PASSWORD in the env file
  # (native name: compose interpolation cannot map it from another variable).
  grafana:
    image: grafana/grafana:11
    user: "0:0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env.production
    environment:
      TZ: America/Sao_Paulo
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  # --- Loki ---
  # Log aggregation (JSON stdout from services via Promtail). Internal-only,
  # no published ports; queried by Grafana over the compose network.
  loki:
    image: grafana/loki:3
    user: "0:0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

  # --- Promtail ---
  # Ships every container's stdout to Loki. Needs the Docker socket for
  # discovery and the containers log path; both read-only mounts.
  promtail:
    image: grafana/promtail:3
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./observability/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_positions:/positions
    depends_on:
      - loki

  # --- Node Exporter ---
  # Host CPU/RAM/disk for the DiskFull rule; read-only host mounts, no ports.
  node-exporter:
    image: prom/node-exporter:v1
    pid: host
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave

  # --- Database Backup ---
  db-backup:
    image: postgres:16-alpine
    env_file:
      - ../.env.production
    environment:
      BACKUP_SCHEDULE: "0 3 * * *"
      BACKUP_RETENTION_DAYS: "7"
      BACKUP_DIR: /backups
    volumes:
      - backup_data:/backups
    entrypoint: >
      /bin/sh -c "
      echo \"$${BACKUP_SCHEDULE} /usr/local/bin/backup.sh >> /var/log/cron.log 2>&1\" | crontab - &&
      cat > /usr/local/bin/backup.sh << 'EOF'
      #!/bin/sh
      set -e

      TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
      FILE=\"$${BACKUP_DIR}/pode_deixar_$${TIMESTAMP}.sql.gz\"

      echo \"[$$(date)] Iniciando backup para $${FILE}\"

      pg_dump \"$${DATABASE_URL}\" | gzip > \"$${FILE}\"

      echo \"[$$(date)] Backup concluído: $${FILE}\"

      find \"$${BACKUP_DIR}\" \
        -name 'pode_deixar_*.sql.gz' \
        -mtime +$${BACKUP_RETENTION_DAYS} \
        -delete

      echo \"[$$(date)] Limpeza de backups antigos (> $${BACKUP_RETENTION_DAYS} dias) concluída\"
      EOF

      chmod +x /usr/local/bin/backup.sh &&
      /usr/local/bin/backup.sh &&
      crond -f -l 2
      "

  # --- Reverse Proxy ---
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_VERSION: ${API_VERSION:-v1}
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - auth
      - users
      - service-orders
      - payments
      - reviews

volumes:
  minio_data:
  backup_data:
  redis_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions: