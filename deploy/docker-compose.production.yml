# purpose: Production deploy (Neon database, Vercel frontend, external SMTP)
# Run: docker compose -f docker-compose.production.yml up -d --build
# Env: .env.production; no local Postgres, Mailpit, source volumes, or public ports on internal services
# Caddy on 80/443; periodic pg_dump backup of Neon

name: pode-deixar-production

services:

  # --- Auth Service ---
  auth:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: auth-build
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-https://app.pode-deixar.com}
      TZ: America/Sao_Paulo
      DATABASE_URL: ${DB_AUTH_URL:?DB_AUTH_URL must be set in .env.production}
    depends_on:
      storage:
        condition: service_healthy

  # --- Users Service ---
  users:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: users-build
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
      DATABASE_URL: ${DB_USERS_URL:?DB_USERS_URL must be set in .env.production}
    depends_on:
      storage:
        condition: service_healthy

  # --- Service Orders Service ---
  service-orders:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: service-orders-build
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
      DATABASE_URL: ${DB_SERVICE_ORDERS_URL:?DB_SERVICE_ORDERS_URL must be set in .env.production}
    depends_on:
      storage:
        condition: service_healthy

  # --- Payments Service ---
  payments:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: payments-build
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
      DATABASE_URL: ${DB_PAYMENTS_URL:?DB_PAYMENTS_URL must be set in .env.production}

  # --- Reviews Service ---
  reviews:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: reviews-build
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
      DATABASE_URL: ${DB_REVIEWS_URL:?DB_REVIEWS_URL must be set in .env.production}

  # --- Object storage (S3) ---
  # SeaweedFS S3 gateway, credentials generated at startup from
  # STORAGE_ACCESS_KEY/STORAGE_SECRET_KEY (see the base compose for why).
  storage:
    image: chrislusf/seaweedfs:3.97
    entrypoint:
      - /bin/sh
      - -c
    command:
      - >
        printf '{"identities":[{"name":"anonymous","actions":["Read:%s","Read:%s"]},{"name":"pode-deixar","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","Delete","List","Tagging"]}]}' "$${STORAGE_SERVICE_IMAGES_BUCKET:-service-images}" "$${STORAGE_AVATARS_BUCKET:-avatars}" "$${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY must be set in .env.production}" "$${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY must be set in .env.production}" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=$${STORAGE_PORT:-8333} -s3.config=/tmp/s3.json
    env_file:
      - ../.env.production
    volumes:
      - seaweedfs_data:/data
    # A imagem não tem curl (3.97 traz wget/nc); nc só checa que o S3 está
    # aceitando conexão, que é o que importa para o job de buckets.
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # --- Storage buckets setup ---
  # mc is only an S3 client here; it works against any S3-compatible endpoint.
  storage-setup:
    image: quay.io/minio/aistor/mc:latest@sha256:b8a369454c7cffe3aab1cc6e6b3e7e1eb958415ea275315245d994d830299dbb
    env_file:
      - ../.env.production
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:$${STORAGE_PORT:-8333} $${STORAGE_ACCESS_KEY:?} $${STORAGE_SECRET_KEY:?} &&
      mc mb local/$${STORAGE_SERVICE_IMAGES_BUCKET:-service-images} --ignore-existing &&
      mc mb local/$${STORAGE_AVATARS_BUCKET:-avatars} --ignore-existing &&
      mc mb local/$${STORAGE_ORDER_PHOTOS_BUCKET:-order-photos} --ignore-existing &&
      echo 'Buckets created successfully'
      "

  # --- Redis ---
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Database Backup ---
  db-backup:
    image: postgres:16-alpine
    env_file:
      - ../.env.production
    environment:
      BACKUP_SCHEDULE: "0 3 * * *"
      BACKUP_RETENTION_DAYS: "7"
      BACKUP_DIR: /backups
    volumes:
      - backup_data:/backups
    entrypoint: >
      /bin/sh -c "
      echo \"$${BACKUP_SCHEDULE} /usr/local/bin/backup.sh >> /var/log/cron.log 2>&1\" | crontab - &&
      cat > /usr/local/bin/backup.sh << 'EOF'
      #!/bin/sh
      set -e

      TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
      FILE=\"$${BACKUP_DIR}/pode_deixar_$${TIMESTAMP}.sql.gz\"

      echo \"[$$(date)] Iniciando backup para $${FILE}\"

      pg_dump \"$${DATABASE_URL}\" | gzip > \"$${FILE}\"

      echo \"[$$(date)] Backup concluído: $${FILE}\"

      find \"$${BACKUP_DIR}\" \
        -name 'pode_deixar_*.sql.gz' -mtime +$${BACKUP_RETENTION_DAYS} \
        -delete

      echo \"[$$(date)] Limpeza de backups antigos (> $${BACKUP_RETENTION_DAYS} dias) concluída\"
      EOF

      chmod +x /usr/local/bin/backup.sh &&
      /usr/local/bin/backup.sh &&
      crond -f -l 2
      "

  # --- Reverse Proxy ---
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_VERSION: ${API_VERSION:-v1}
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - auth
      - users
      - service-orders
      - payments
      - reviews

volumes:
  seaweedfs_data:
  backup_data:
  redis_data:
  caddy_data:
  caddy_config: