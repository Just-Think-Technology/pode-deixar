# Tempo — distributed traces, OTLP/HTTP straight from the SDK (no collector).
# Single binary, local storage, 15-day retention. Internal-only: queried by
# Grafana over the compose network; OTLP endpoint tempo:4318.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester_client:
  grpc_client_config:
    max_recv_msg_size: 4194304
    max_send_msg_size: 4194304

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 360h
