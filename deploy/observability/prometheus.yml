# Prometheus — scrapes the 5 services plus itself and node-exporter.
# All targets are internal compose DNS names; /metrics has no Caddy route.
# The bearer comes from /etc/prometheus/metrics_token, written at container
# start from METRICS_TOKEN (see the prometheus service entrypoint).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: auth
    metrics_path: /metrics
    static_configs:
      - targets: ['auth:3001']
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token

  - job_name: users
    metrics_path: /metrics
    static_configs:
      - targets: ['users:3002']
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token

  - job_name: service-orders
    metrics_path: /metrics
    static_configs:
      - targets: ['service-orders:3003']
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token

  - job_name: payments
    metrics_path: /metrics
    static_configs:
      - targets: ['payments:3004']
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token

  - job_name: reviews
    metrics_path: /metrics
    static_configs:
      - targets: ['reviews:3005']
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
