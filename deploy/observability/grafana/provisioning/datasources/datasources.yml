# Grafana datasource provisioning — Prometheus, Loki and Tempo on the internal
# network. Fixed uids: the log lines carry traceId/spanId, so the Loki derived
# field links a log line to its trace in Tempo without a second lookup.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # Log → trace: the traceId written by the pino mixin becomes a link.
      # $${__value.raw} survives Grafana env expansion as ${__value.raw}.
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceId":"(\w+)"'
          url: '$${__value.raw}'
          datasourceUid: tempo
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
