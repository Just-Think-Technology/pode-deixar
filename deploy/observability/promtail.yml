# Promtail — ships every container's stdout to Loki.
# Service logs are JSON in production (service/level/event/msg); anything
# else (Caddy, Redis, boot lines) still ships, just without parsed labels.
# Only service + level become Loki labels — orderId/paymentId stay searchable
# in the log body, never in labels (cardinality + LGPD).

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '/(.+)'
        target_label: container
      - source_labels: [__meta_docker_compose_service]
        regex: '(.+)'
        target_label: compose_service
    pipeline_stages:
      - json:
          expressions:
            service: service
            level: level
            event: event
            msg: msg
      - labels:
          service:
          level:
      - output:
          source: msg
