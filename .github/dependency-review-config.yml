# Configuration for GitHub Dependency Review Action
# https://github.com/actions/dependency-review-action

# Fail the build if any vulnerability with severity >= high is found
fail-on-severity: high

# Ignore specific vulnerabilities (use sparingly, with justification)
# allow-ghsas:
#   - GHSA-xxxx-xxxx-xxxx  # Justification: ...

# Configuration for license scanning
license-check:
  allowed:
    - MIT
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause
    - ISC
    - CC0-1.0
    - Unlicense
  # deny:
  #   - GPL-3.0-only  # Example: deny GPL licenses