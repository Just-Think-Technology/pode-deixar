      - name: Create .env.staging for CI
        shell: bash
        run: |
          cat > .env.staging << 'EOF'
          NODE_ENV=test
          AUTH_PORT=3001
          USERS_PORT=3002
          SERVICE_ORDERS_PORT=3003
          JWT_ACCESS_SECRET=ci-test-access-secret
          JWT_REFRESH_SECRET=ci-test-refresh-secret
          SMTP_HOST=localhost
          SMTP_PORT=1025
          SMTP_USER=
          SMTP_PASS=
          SMTP_FROM=noreply@pode-deixar.com
          MAX_LOGIN_ATTEMPTS=5
          LOCKOUT_DURATION_MINUTES=15
          DATABASE_URL=postgresql://pode-deixar:pode-deixar@localhost:5432/pode-deixar-test
          DIRECT_DATABASE_URL=postgresql://pode-deixar:pode-deixar@localhost:5432/pode-deixar-test
          EOF
      - name: Run Prisma migrations
        shell: bash
        run: pnpm exec prisma migrate deploy --schema=prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://pode-deixar:pode-deixar@localhost:5432/pode-deixar-test
          DIRECT_DATABASE_URL: postgresql://pode-deixar:pode-deixar@localhost:5432/pode-deixar-test
      - run: pnpm run --filter @pode-deixar/service-orders build
      - run: pnpm run --filter @pode-deixar/service-orders lint
      - run: pnpm run --filter @pode-deixar/service-orders test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5
      - run: corepack enable && corepack prepare pnpm@latest --activate
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint and build in parallel
        shell: bash
        run: |
          pnpm run lint &
          pnpm run build &
          FAIL=0
          for job in $(jobs -p); do wait $job || FAIL=1; done
          exit $FAIL
