          NODE_ENV=test
          AUTH_PORT=3001
          USERS_PORT=3002
          SERVICE_ORDERS_PORT=3003
          JWT_ACCESS_SECRET=ci-test-access-secret
          JWT_REFRESH_SECRET=ci-test-refresh-secret
          SMTP_HOST=localhost
          SMTP_PORT=1025
          SMTP_USER=
          SMTP_PASS=
          SMTP_FROM=noreply@pode-deixar.com
          MAX_LOGIN_ATTEMPTS=5
          LOCKOUT_DURATION_MINUTES=15
          DATABASE_URL=postgresql://pode-deixar:pode-deixar@localhost:5432/pode-deixar-test
          DIRECT_DATABASE_URL=postgresql://pode-deixar:pode-deixar@localhost:5432/pode-deixar-test
          EOF
      - name: Run Prisma migrations
        shell: bash
        run: pnpm exec prisma migrate deploy --schema=prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://pode-deixar:pode-deixar@localhost:5432/pode-deixar-test
          DIRECT_DATABASE_URL: postgresql://pode-deixar:pode-deixar@localhost:5432/pode-deixar-test
      - run: pnpm run --filter @pode-deixar/users build
      - run: pnpm run --filter @pode-deixar/users lint
      - run: pnpm run --filter @pode-deixar/users test

  backend-service-orders:
    needs: backend-setup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pode-deixar
