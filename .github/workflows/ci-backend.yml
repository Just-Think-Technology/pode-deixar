# purpose: CI pipeline for backend services (matrix build, lint, test, e2e, security, build, image, codeql, dependency-review).

name: ci-backend

on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

env:
  NODE_VERSION: 22
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.matrix.outputs.services }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'backend/pnpm-lock.yaml'
              - 'backend/package.json'
              - 'backend/pnpm-workspace.yaml'
              - 'backend/tsconfig*.json'
              - 'backend/prisma/schema.prisma'
              - 'backend/shared/**'
            auth:
              - 'backend/services/auth/**'
            users:
              - 'backend/services/users/**'
            service-orders:
              - 'backend/services/service-orders/**'
            payments:
              - 'backend/services/payments/**'
            reviews:
              - 'backend/services/reviews/**'
            e2e:
              - 'backend/e2e/**'

      - name: Compute affected service matrix
        id: matrix
        run: |
          set -e
          if [ "${{ steps.filter.outputs.shared }}" = "true" ]; then
            echo 'services=["auth","users","service-orders","payments","reviews"]' >> "$GITHUB_OUTPUT"
          else
            SERVICES=$(jq -nc \
              --argjson auth '${{ steps.filter.outputs.auth }}' \
              --argjson users '${{ steps.filter.outputs.users }}' \
              --argjson serviceOrders '${{ steps.filter.outputs['service-orders'] }}' \
              --argjson payments '${{ steps.filter.outputs.payments }}' \
              --argjson reviews '${{ steps.filter.outputs.reviews }}' \
              '[
                (if $auth then "auth" else empty end),
                (if $users then "users" else empty end),
                (if $serviceOrders then "service-orders" else empty end),
                (if $payments then "payments" else empty end),
                (if $reviews then "reviews" else empty end)
              ]')
            echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          fi

      - name: Show affected services
        run: 'echo "Serviços afetados: ${{ steps.matrix.outputs.services }}"'

  quick:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Each matrix job runs in an isolated runner with its own Postgres container,
      # so a single database per job is sufficient. Named by service only for
      # more readable logs.
      - name: Create test database for ${{ matrix.service }}
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE \"pode_deixar_test_${{ matrix.service }}\";"
        env:
          PGPASSWORD: postgres

      - run: pnpm exec prisma generate --schema=prisma/schema.prisma

      - run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE pode_deixar_test;"

      - run: pnpm run --filter @pode-deixar/${{ matrix.service }} lint
      - run: pnpm run --filter @pode-deixar/${{ matrix.service }} typecheck

      - run: pnpm run --filter @pode-deixar/${{ matrix.service }} test

  # Cross-service e2e journey (users → orders → payments → reviews in the
  # same database, as in production). Standalone job without matrix.
  e2e:
    needs: changes
    if: needs.changes.outputs.services != '[]' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm exec prisma generate --schema=prisma/schema.prisma

      - run: pnpm run --filter @pode-deixar/e2e typecheck

      - run: pnpm run test:e2e

  # Regression tests for shared packages (logger/email/security).
  # Unit-only tests; no Postgres. The `quick` job runs per service.
  shared:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm run test:shared

  # Security now depends only on `quick`, same as `build` — they run in
  # parallel instead of security blocking the start of the build. Who depends
  # on both is the `image` job, which is the one that actually needs the full gate.
  security:
    needs: [changes, quick]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm audit --prod --audit-level=high

      # TruffleHog Secret Scanning
      - name: TruffleHog Secret Scanning
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51
        with:
          extra_args: --only-verified

  # `build` now depends only on `quick`, same as `security` — both run in
  # parallel instead of security blocking the start of the build. Who depends
  # on both is the `image` job, which is the one that actually needs the full gate.
  build:
    needs: [changes, quick]
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Prisma Generate Cache
      - uses: actions/cache@v4
        with:
          path: backend/node_modules/.prisma
          key: prisma-generate-${{ runner.os }}-${{ hashFiles('backend/prisma/schema.prisma') }}
          restore-keys: |
            prisma-generate-${{ runner.os }}-

      - run: pnpm exec prisma generate --schema=prisma/schema.prisma
      - run: pnpm run --filter @pode-deixar/${{ matrix.service }} build
      - run: pnpm run --filter @pode-deixar/${{ matrix.service }} typecheck

  image:
    needs: [changes, build, security]
    if: github.event_name != 'pull_request' && needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The metadata-action publishes tags always in lowercase, but
      # IMAGE_PREFIX preserves the org name (Just-Think-Technology).
      # Normalizes the reference used in read (sbom/cosign) to the canonical
      # lowercase form — same as what was effectively published.
      # (Already fixed in ci-frontend.)
      - name: Normalize image reference to lowercase
        run: echo "IMAGE_REF=${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_PREFIX }}-${{ matrix.service }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - name: Build and push image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_REF }}@${{ steps.docker_build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
          retention-days: 90

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, via OIDC/Sigstore)
        run: |
          cosign sign --yes \
            "${{ env.IMAGE_REF }}@${{ steps.docker_build.outputs.digest }}"

  codeql:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@v3

  dependency-review:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical