name: ci-backend

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: 22

jobs:
  quick:
    strategy:
      fail-fast: false
      matrix:
        service: [auth, users, service-orders, payments, reviews]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g pnpm && pnpm install
      - run: pnpm run --filter @pode-deixar/${{ matrix.service }} lint
      - run: pnpm run --filter @pode-deixar/${{ matrix.service }} typecheck
      - run: pnpm run --filter @pode-deixar/${{ matrix.service }} test

security:
    needs: quick
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g pnpm && pnpm install
      - run: pnpm run --filter @pode-deixar/${{ matrix.service }} typecheck
      - run: pnpm audit --prod --audit-level=high
      - name: TruffleHog Secret Scanning
        uses: trufflehog/hunter-action@main
        with:
          args: --only-verified --fail
      - name: ESLint Security Plugin
        uses: returned0t/trufflehog-eslint@main
        with:
          eslint-dir: backend
          config: '{"plugins":["security"]}'

  build:
    needs: security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        service: [auth, users, service-orders, payments, reviews]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g pnpm && pnpm install
      - run: pnpm cache clean
      - run: pnpm run --filter @pode-deixar/${{ matrix.service }} build
      - run: pnpm run --filter @pode-deixar/${{ matrix.service }} typecheck
      - name: Prisma Generate Cache
        uses: actions/cache@v4
        with:
          path: ~/.prisma
          key: prisma-generate-${{ runner.os }}-${{ hashFiles('backend/prisma/schema.prisma') }}
          restore-keys: |
            prisma-generate-${{ runner.os }}-
      - run: pnpm exec prisma generate --schema=prisma/schema.prisma

  codeql:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v2
        with:
          languages: python
          build-mode: none
      - run: codeql/analyze

  dependency-review:
    needs: codeql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dependency Review
        uses: actions/download-artifact@v4
        with:
          name: dependabot-details
          path: /tmp
      - uses: github.com/dependencies/action@main
        with:
          fail-on-severity: critical
        continue-on-error: true