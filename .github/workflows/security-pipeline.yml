name: security-pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "shared/**"
      - ".github/workflows/security-pipeline.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "shared/**"
      - ".github/workflows/security-pipeline.yml"
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday 06:00 UTC

env:
  NODE_VERSION: 22

jobs:
  # Dependency vulnerability scanning
  dependency-audit:
    name: Dependency Audit (pnpm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable && corepack prepare pnpm@latest --activate
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - name: Run pnpm audit (backend)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: false
      - name: Run pnpm audit (frontend)
        working-directory: frontend
        run: pnpm audit --prod --audit-level=high
        continue-on-error: false

  # Dependency review for PRs
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high

  # Secret scanning
  secret-scan:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || '' }}
          head: ${{ github.event.pull_request.head.sha || '' }}
          extra_args: --only-verified --fail

  # Static Analysis (CodeQL)
  codeql-analysis:
    name: Static Analysis (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [typescript]
    steps:
      - uses: actions/checkout@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql-config.yml
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # SAST with ESLint Security Plugin
  eslint-security:
    name: ESLint Security Rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable && corepack prepare pnpm@latest --activate
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run ESLint Security Rules (backend)
        run: pnpm run lint
        continue-on-error: false
      - name: Run ESLint Security Rules (frontend)
        working-directory: frontend
        run: pnpm run lint
        continue-on-error: false

  # Dockerfile security scan (Hadolint)
  dockerfile-scan:
    name: Dockerfile Security (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Hadolint Dockerfile Scan
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error
          recursive: true

  # Summary
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs:
      - dependency-audit
      - dependency-review
      - secret-scan
      - codeql-analysis
      - eslint-security
      - dockerfile-scan
    if: always()
    steps:
      - name: Security Pipeline Summary
        run: |
          echo "## Security Pipeline Results"
          echo ""
          echo "| Job | Status |"
          echo "|-----|--------|"
          echo "| Dependency Audit | ${{ needs.dependency-audit.result }} |"
          echo "| Dependency Review | ${{ needs.dependency-review.result }} |"
          echo "| Secret Scan | ${{ needs.secret-scan.result }} |"
          echo "| CodeQL Analysis | ${{ needs.codeql-analysis.result }} |"
          echo "| ESLint Security | ${{ needs.eslint-security.result }} |"
          echo "| Dockerfile Scan | ${{ needs.dockerfile-scan.result }} |"
          echo ""
          if [[ "${{ needs.dependency-audit.result }}" != "success" ]] || \
             [[ "${{ needs.dependency-review.result }}" != "success" ]] || \
             [[ "${{ needs.secret-scan.result }}" != "success" ]] || \
             [[ "${{ needs.codeql-analysis.result }}" != "success" ]] || \
             [[ "${{ needs.eslint-security.result }}" != "success" ]] || \
             [[ "${{ needs.dockerfile-scan.result }}" != "success" ]]; then
            echo "::error::One or more security checks failed"
            exit 1
          fi