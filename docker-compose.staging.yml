      - ./backend/prisma:/app/prisma

  # -- Service Orders Service --
  service-orders:
    env_file:
      - ./.env.staging
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      target: service-orders-build
    command: >
      sh -c "rm -f /app/services/service-orders/tsconfig.build.tsbuildinfo &&
             pnpm run --filter @pode-deixar/service-orders start:dev"
    volumes:
      - ./backend/services/service-orders/src:/app/services/service-orders/src
      - ./backend/services/service-orders/tsconfig.json:/app/services/service-orders/tsconfig.json
      - ./backend/services/service-orders/tsconfig.build.json:/app/services/service-orders/tsconfig.build.json
