# ============================================================
# Pode Deixar - Staging com hot-reload
# ============================================================
#   docker compose -f docker-compose.staging.yml up -d --build
#
# Mesmos serviços do production, mas:
# - Env: .env.staging
# - Backend em modo dev / hot-reload
# - Código fonte montado
# - start:dev
# - Banco: Neon staging
# - Sem frontend
# - Sem Mailpit
# - Sem Postgres local
# - Sem portas públicas nos serviços internos
# - Caddy continua responsável pelo acesso externo
#
# IMPORTANTE:
# Os diretórios dist/ dos shared packages NÃO são montados.
# Eles permanecem os builds gerados pela imagem Docker.
# ============================================================

include:
  - path: docker-compose.production.yml

name: pode-deixar-staging

services:

  # -- Auth Service --
  auth:
    env_file:
      - ./.env.staging
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      target: auth-build
    command: >
      sh -c "pnpm exec prisma migrate deploy --schema=prisma/schema.prisma &&
             pnpm run --filter @pode-deixar/auth start:dev"
    volumes:
      - ./backend/services/auth/src:/app/services/auth/src
      - ./backend/services/auth/tsconfig.json:/app/services/auth/tsconfig.json
      - ./backend/services/auth/tsconfig.build.json:/app/services/auth/tsconfig.build.json
      - ./backend/services/auth/nest-cli.json:/app/services/auth/nest-cli.json

      # Logger
      - ./backend/shared/logger/index.ts:/app/shared/logger/index.ts
      - ./backend/shared/logger/tsconfig.json:/app/shared/logger/tsconfig.json

      # Email
      - ./backend/shared/email/email.module.ts:/app/shared/email/email.module.ts
      - ./backend/shared/email/email.service.ts:/app/shared/email/email.service.ts
      - ./backend/shared/email/email.templates.ts:/app/shared/email/email.templates.ts
      - ./backend/shared/email/index.ts:/app/shared/email/index.ts
      - ./backend/shared/email/tsconfig.json:/app/shared/email/tsconfig.json

      # Security
      - ./backend/shared/security/helmet-config.ts:/app/shared/security/helmet-config.ts
      - ./backend/shared/security/index.ts:/app/shared/security/index.ts
      - ./backend/shared/security/redis-throttler-storage.ts:/app/shared/security/redis-throttler-storage.ts
      - ./backend/shared/security/src:/app/shared/security/src
      - ./backend/shared/security/tsconfig.json:/app/shared/security/tsconfig.json

      # Validation
      - ./backend/shared/validation/index.ts:/app/shared/validation/index.ts
      - ./backend/shared/validation/src:/app/shared/validation/src
      - ./backend/shared/validation/tsconfig.json:/app/shared/validation/tsconfig.json

      # Prisma
      - ./backend/prisma:/app/prisma

