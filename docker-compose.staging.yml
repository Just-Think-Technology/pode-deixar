# purpose: Pode Deixal staging stack with hot-reload (single command).
# Same services as docker-compose.production.yml (no frontend — Vercel;
# no Mailpit — real SMTP; no Postgres — Neon staging), but running in dev mode:
# Dockerfile.dev + code mounted + start:dev, same as docker-compose.dev.yml.
# Volume lists: keep mirrored with dev.yml. No `ports:` (access only via Caddy,
# as in production).
#
#   docker compose -f docker-compose.staging.yml up -d --build
#
# Same services as docker-compose.production.yml (without frontend — Vercel;
# without Mailpit — real SMTP; without Postgres — Neon staging), but running
# in dev mode: Dockerfile.dev + code mounted + start:dev, same as
# docker-compose.dev.yml. Volume lists: keep mirrored with dev.yml. No `ports:`
# (access only via Caddy, as in prod).

include:
  - path: docker-compose.production.yml

name: pode-deixar-staging

services:

  auth:
    env_file: ./.env.staging
    build:
      dockerfile: Dockerfile.dev
    command: >
      sh -c "pnpm exec prisma migrate deploy --schema=prisma/schema.prisma &&
             pnpm run --filter @pode-deixar/auth start:dev"
    volumes:
      - ./backend/services/auth/src:/app/services/auth/src
      - ./backend/services/auth/tsconfig.json:/app/services/auth/tsconfig.json
      - ./backend/services/auth/tsconfig.build.json:/app/services/auth/tsconfig.build.json
      - ./backend/services/auth/nest-cli.json:/app/services/auth/nest-cli.json
      - ./backend/shared/logger:/app/shared/logger
      - ./backend/shared/email:/app/shared/email
      - ./backend/shared/security:/app/shared/security
      - ./backend/shared/validation:/app/shared/validation
      - ./backend/prisma:/app/prisma

  users:
    env_file: ./.env.staging
    build:
      dockerfile: Dockerfile.dev
    command: pnpm run --filter @pode-deixar/users start:dev
    volumes:
      - ./backend/services/users/src:/app/services/users/src
      - ./backend/services/users/tsconfig.json:/app/services/users/tsconfig.json
      - ./backend/services/users/tsconfig.build.json:/app/services/users/tsconfig.build.json
      - ./backend/services/users/nest-cli.json:/app/services/users/nest-cli.json
      - ./backend/shared/logger:/app/shared/logger
      - ./backend/shared/security:/app/shared/security
      - ./backend/shared/validation:/app/shared/validation
      - ./backend/prisma:/app/prisma

  service-orders:
    env_file: ./.env.staging
    build:
      dockerfile: Dockerfile.dev
    command: >
      sh -c "rm -f /app/services/service-orders/tsconfig.build.tsbuildinfo &&
             pnpm run --filter @pode-deixar/service-orders start:dev"
    volumes:
      - ./backend/services/service-orders/src:/app/services/service-orders/src
      - ./backend/services/service-orders/tsconfig.json:/app/services/service-orders/tsconfig.json
      - ./backend/services/service-orders/tsconfig.build.json:/app/services/service-orders/tsconfig.build.json
      - ./backend/services/service-orders/nest-cli.json:/app/services/service-orders/nest-cli.json
      - ./backend/shared/logger:/app/shared/logger
      - ./backend/shared/security:/app/shared/security
      - ./backend/shared/validation:/app/shared/validation
      - ./backend/prisma:/app/prisma

  payments:
    env_file: ./.env.staging
    build:
      dockerfile: Dockerfile.dev
    command: >
      sh -c "pnpm exec prisma generate --schema=prisma/schema.prisma &&
             pnpm exec prisma migrate deploy --schema=prisma/schema.prisma &&
             pnpm run --filter @pode-deixar/payments start:dev"
    volumes:
      - ./backend/services/payments/src:/app/services/payments/src
      - ./backend/services/payments/tsconfig.json:/app/services/payments/tsconfig.json
      - ./backend/services/payments/tsconfig.build.json:/app/services/payments/tsconfig.build.json
      - ./backend/services/payments/nest-cli.json:/app/services/payments/nest-cli.json
      - ./backend/shared/logger:/app/shared/logger
      - ./backend/shared/security:/app/shared/security
      - ./backend/shared/validation:/app/shared/validation
      - ./backend/prisma:/app/prisma

  reviews:
    env_file: ./.env.staging
    build:
      dockerfile: Dockerfile.dev
    command: pnpm run --filter @pode-deixar/reviews start:dev
    volumes:
      - ./backend/services/reviews/src:/app/services/reviews/src
      - ./backend/services/reviews/tsconfig.json:/app/services/reviews/tsconfig.json
      - ./backend/services/reviews/tsconfig.build.json:/app/services/reviews/tsconfig.build.json
      - ./backend/services/reviews/nest-cli.json:/app/services/reviews/nest-cli.json
      - ./backend/shared/logger:/app/shared/logger
      - ./backend/shared/security:/app/shared/security
      - ./backend/shared/validation:/app/shared/validation
      - ./backend/prisma:/app/prisma

  minio:
    env_file: ./.env.staging
  minio-setup:
    env_file: ./.env.staging
  db-backup:
    env_file: ./.env.staging